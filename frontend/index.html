<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>FleetTrack · Dispecerat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      // tema aleasă data trecută, aplicată înainte de prima desenare (fără „clipire”)
      try {
        const t = localStorage.getItem("fleettrack-tema");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) { /* localStorage indisponibil: rămâne tema sistemului */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
